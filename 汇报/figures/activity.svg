<svg xmlns="http://www.w3.org/2000/svg" width="760" height="690" viewBox="0 0 760 690" font-family="sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0 0, 9 4.5, 0 9" fill="#475569"/>
    </marker>
  </defs>
  <rect width="760" height="690" fill="#ffffff"/>

  <!-- 开始 -->
  <circle cx="380" cy="34" r="13" fill="#16A34A"/>

  <!-- 活动节点 -->
  <g fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4">
    <rect x="260" y="76" width="240" height="44" rx="10"/>
    <rect x="260" y="164" width="240" height="44" rx="10"/>
    <rect x="260" y="252" width="240" height="44" rx="10"/>
    <rect x="260" y="400" width="240" height="44" rx="10"/>
    <rect x="150" y="548" width="220" height="44" rx="10"/>
    <rect x="390" y="548" width="220" height="44" rx="10"/>
  </g>
  <g font-size="13.5" fill="#1E293B" text-anchor="middle">
    <text x="380" y="103">启动 TinyEDA，新建/打开项目</text>
    <text x="380" y="191">从调色板放置元件</text>
    <text x="380" y="279">绘制导线连接元件引脚</text>
    <text x="380" y="427">运行仿真，查看电平</text>
    <text x="260" y="575">导出 KiCad 网表</text>
    <text x="500" y="575">生成 Verilog 代码</text>
  </g>

  <!-- 判断菱形 -->
  <polygon points="380,316 470,342 380,368 290,342" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.4"/>
  <polygon points="380,466 470,492 380,518 290,492" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.4"/>
  <text x="380" y="348" text-anchor="middle" font-size="13" fill="#C2410C">连接完整?</text>
  <text x="380" y="498" text-anchor="middle" font-size="13" fill="#C2410C">结果正确?</text>

  <!-- 结束 -->
  <circle cx="380" cy="656" r="13" fill="#DC2626"/>

  <!-- 顺序箭头 -->
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M380,47 L380,76"/>
    <path d="M380,120 L380,164"/>
    <path d="M380,208 L380,252"/>
    <path d="M380,296 L380,316"/>
    <path d="M470,342 L526,342 L526,400 L500,400"/>
    <path d="M380,444 L380,466"/>
    <path d="M470,492 L526,492 L526,530"/>
    <path d="M526,530 L260,530 L260,548"/>
    <path d="M526,530 L500,530 L500,548"/>
    <path d="M260,592 L260,620 L380,620 L380,643"/>
    <path d="M500,592 L500,620 L380,620"/>
  </g>

  <!-- 回流箭头 -->
  <g stroke="#DC2626" stroke-width="1.4" fill="none" marker-end="url(#arr)">
    <path d="M290,342 L196,342 L196,274 L260,274"/>
    <path d="M290,492 L196,492 L196,186 L260,186"/>
  </g>

  <!-- 分支标签 -->
  <g font-size="12.5" fill="#DC2626">
    <text x="492" y="334">是</text>
    <text x="150" y="334">否</text>
    <text x="150" y="480">否，修改电路</text>
    <text x="492" y="484">是</text>
  </g>

  <text x="20" y="680" font-size="12" fill="#64748B">图1-2 电路设计·仿真·输出活动图</text>
</svg>
