<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" font-family="sans-serif">
  <rect width="920" height="470" fill="#ffffff"/>

  <!-- 表头 -->
  <text x="24" y="30" font-size="15" font-weight="bold" fill="#334155">TinyEDA 开发计划甘特图（10 周）</text>

  <!-- 周刻度 -->
  <g stroke="#CBD5E1" stroke-width="1">
    <line x1="140" y1="50" x2="140" y2="430"/>
    <line x1="216" y1="50" x2="216" y2="430"/>
    <line x1="292" y1="50" x2="292" y2="430"/>
    <line x1="368" y1="50" x2="368" y2="430"/>
    <line x1="444" y1="50" x2="444" y2="430"/>
    <line x1="520" y1="50" x2="520" y2="430"/>
    <line x1="596" y1="50" x2="596" y2="430"/>
    <line x1="672" y1="50" x2="672" y2="430"/>
    <line x1="748" y1="50" x2="748" y2="430"/>
    <line x1="824" y1="50" x2="824" y2="430"/>
    <line x1="900" y1="50" x2="900" y2="430"/>
  </g>
  <g font-size="11" fill="#64748B" text-anchor="middle">
    <text x="140" y="42">第1周</text>
    <text x="216" y="42">第2周</text>
    <text x="292" y="42">第3周</text>
    <text x="368" y="42">第4周</text>
    <text x="444" y="42">第5周</text>
    <text x="520" y="42">第6周</text>
    <text x="596" y="42">第7周</text>
    <text x="672" y="42">第8周</text>
    <text x="748" y="42">第9周</text>
    <text x="824" y="42">第10周</text>
  </g>

  <!-- 当前时间线 -->
  <line x1="824" y1="48" x2="824" y2="430" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="824" y="445" text-anchor="middle" font-size="11" fill="#DC2626">当前（第10周）</text>

  <!-- 任务条 -->
  <g>
    <rect x="140" y="63" width="152" height="18" rx="4" fill="#3B82F6"/>
    <text x="20" y="77" font-size="12" fill="#334155">1 需求分析与项目规划</text>

    <rect x="140" y="103" width="228" height="18" rx="4" fill="#3B82F6"/>
    <text x="20" y="117" font-size="12" fill="#334155">2 环境搭建与跨平台构建</text>

    <rect x="216" y="143" width="228" height="18" rx="4" fill="#6366F1"/>
    <text x="20" y="157" font-size="12" fill="#334155">3 电路图编辑核心</text>

    <rect x="292" y="183" width="228" height="18" rx="4" fill="#6366F1"/>
    <text x="20" y="197" font-size="12" fill="#334155">4 项目 XML 与用户配置</text>

    <rect x="368" y="223" width="152" height="18" rx="4" fill="#8B5CF6"/>
    <text x="20" y="237" font-size="12" fill="#334155">5 数字逻辑仿真</text>

    <rect x="444" y="263" width="228" height="18" rx="4" fill="#10B981"/>
    <text x="20" y="277" font-size="12" fill="#334155">6 KiCad 网表导出</text>

    <rect x="444" y="303" width="304" height="18" rx="4" fill="#F59E0B"/>
    <text x="20" y="317" font-size="12" fill="#334155">7 Verilog 双向转换</text>

    <rect x="520" y="343" width="304" height="18" rx="4" fill="#EF4444"/>
    <text x="20" y="357" font-size="12" fill="#334155">8 AI 助手（Agent）</text>

    <rect x="596" y="383" width="304" height="18" rx="4" fill="#64748B"/>
    <text x="20" y="397" font-size="12" fill="#334155">9 测试与文档</text>
  </g>

  <!-- 图例 -->
  <g font-size="11.5" fill="#334155">
    <rect x="140" y="445" width="14" height="12" rx="2" fill="#3B82F6"/>
    <text x="160" y="455">已完成（按计划推进）</text>
    <rect x="340" y="445" width="14" height="12" rx="2" fill="#F59E0B"/>
    <text x="360" y="455">进行中</text>
  </g>
</svg>
