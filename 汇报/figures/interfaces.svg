<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0 0, 9 4.5, 0 9" fill="#3B82F6"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>

  <!-- 顶层 -->
  <rect x="395" y="40" width="170" height="54" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/>
  <text x="480" y="66" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1E3A8A">MainFrame</text>
  <text x="480" y="84" text-anchor="middle" font-size="10.5" fill="#475569">主窗口（组装/布局/事件分发）</text>

  <!-- 中间层 -->
  <g>
    <rect x="45" y="200" width="170" height="54" rx="8" fill="#ffffff" stroke="#3B82F6"/>
    <rect x="275" y="200" width="170" height="54" rx="8" fill="#ffffff" stroke="#3B82F6"/>
    <rect x="505" y="200" width="170" height="54" rx="8" fill="#ffffff" stroke="#3B82F6"/>
    <rect x="735" y="200" width="170" height="54" rx="8" fill="#ffffff" stroke="#3B82F6"/>
    <text x="130" y="226" text-anchor="middle" font-size="13" fill="#1E293B">Canvas 画布</text>
    <text x="130" y="242" text-anchor="middle" font-size="10.5" fill="#64748B">编辑/仿真桥接</text>
    <text x="360" y="226" text-anchor="middle" font-size="13" fill="#1E293B">SimulationSession</text>
    <text x="360" y="242" text-anchor="middle" font-size="10.5" fill="#64748B">仿真会话/诊断</text>
    <text x="590" y="226" text-anchor="middle" font-size="13" fill="#1E293B">AgentArea</text>
    <text x="590" y="242" text-anchor="middle" font-size="10.5" fill="#64748B">AI 面板（聊天/设置）</text>
    <text x="820" y="226" text-anchor="middle" font-size="13" fill="#1E293B">VerilogPanel</text>
    <text x="820" y="242" text-anchor="middle" font-size="10.5" fill="#64748B">代码↔电路面板</text>
  </g>

  <!-- 底层 -->
  <g>
    <rect x="45" y="380" width="170" height="54" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
    <rect x="275" y="380" width="170" height="54" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
    <rect x="505" y="380" width="170" height="54" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
    <rect x="735" y="380" width="170" height="54" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
    <text x="130" y="406" text-anchor="middle" font-size="13" fill="#1E293B">DealProjectXML</text>
    <text x="130" y="422" text-anchor="middle" font-size="10.5" fill="#64748B">项目文件读写</text>
    <text x="360" y="406" text-anchor="middle" font-size="13" fill="#1E293B">Netlist</text>
    <text x="360" y="422" text-anchor="middle" font-size="10.5" fill="#64748B">网表构建/校验/导出</text>
    <text x="590" y="406" text-anchor="middle" font-size="13" fill="#1E293B">Controller</text>
    <text x="590" y="422" text-anchor="middle" font-size="10.5" fill="#64748B">对话调度+工具执行</text>
    <text x="820" y="406" text-anchor="middle" font-size="13" fill="#1E293B">VerilogBridge</text>
    <text x="820" y="422" text-anchor="middle" font-size="10.5" fill="#64748B">Project⇄Module 转换</text>
  </g>

  <!-- 箭头：MainFrame -> 中间层 -->
  <g stroke="#3B82F6" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M480,94 L480,150 M480,150 L130,150 L130,200"/>
    <path d="M480,150 L360,150 L360,200"/>
    <path d="M480,150 L590,150 L590,200"/>
    <path d="M480,150 L820,150 L820,200"/>
  </g>

  <!-- 箭头：中间层 -> 底层 -->
  <g stroke="#3B82F6" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M130,254 L130,380"/>
    <path d="M360,254 L360,380"/>
    <path d="M590,254 L590,380"/>
    <path d="M820,254 L820,380"/>
  </g>

  <!-- 特殊依赖：Controller -> Canvas（工具桥）、Netlist <- DealProjectXML -->
  <g stroke="#F59E0B" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M590,380 L590,470 L130,470 L130,254"/>
    <path d="M130,413 L275,413"/>
  </g>
  <text x="360" y="462" font-size="11" fill="#B45309">工具桥（wxQueueEvent 回主线程）</text>
  <text x="186" y="405" font-size="11" fill="#B45309">数据来源</text>

  <text x="20" y="548" font-size="12" fill="#64748B">图2-2 模块依赖与主要调用关系（蓝=调用，橙=数据/线程桥）</text>
</svg>
