<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" font-family="sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0 0, 9 4.5, 0 9" fill="#475569"/>
    </marker>
  </defs>
  <rect width="720" height="680" fill="#ffffff"/>

  <!-- 开始 -->
  <circle cx="360" cy="28" r="12" fill="#16A34A"/>
  <text x="360" y="16" text-anchor="middle" font-size="11" fill="#64748B">开始</text>

  <!-- 活动节点 -->
  <g fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4">
    <rect x="230" y="56" width="260" height="46" rx="10"/>
    <rect x="230" y="136" width="260" height="46" rx="10"/>
    <rect x="230" y="216" width="260" height="46" rx="10"/>
    <rect x="230" y="400" width="260" height="46" rx="10"/>
    <rect x="230" y="480" width="260" height="46" rx="10"/>
    <rect x="230" y="560" width="260" height="46" rx="10"/>
  </g>
  <g font-size="13.5" fill="#1E293B" text-anchor="middle">
    <text x="360" y="83">用户输入消息（UI 线程）</text>
    <text x="360" y="163">Controller 追加到上下文</text>
    <text x="360" y="243">工作线程请求大模型</text>
    <text x="360" y="427">执行工具（工具桥回主线程）</text>
    <text x="360" y="507">工具结果加入上下文</text>
    <text x="360" y="587">显示最终回复（Markdown）</text>
  </g>

  <!-- 判断菱形 -->
  <polygon points="360,314 448,340 360,366 272,340" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.4"/>
  <text x="360" y="346" text-anchor="middle" font-size="13" fill="#C2410C">响应含 tool_calls?</text>

  <!-- 结束 -->
  <circle cx="360" cy="640" r="12" fill="#DC2626"/>

  <!-- 顺序箭头 -->
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <path d="M360,40 L360,56"/>
    <path d="M360,102 L360,136"/>
    <path d="M360,182 L360,216"/>
    <path d="M360,262 L360,314"/>
    <path d="M448,340 L520,340 L520,400 L490,400"/>
    <path d="M360,446 L360,480"/>
    <path d="M272,340 L200,340 L200,560 L230,560"/>
    <path d="M360,606 L360,628"/>
  </g>

  <!-- 循环回线 -->
  <g stroke="#DC2626" stroke-width="1.4" fill="none" marker-end="url(#arr)">
    <path d="M230,503 L190,503 L190,239 L230,239"/>
  </g>

  <!-- 标签 -->
  <g font-size="12.5">
    <text x="494" y="334" fill="#DC2626">是</text>
    <text x="204" y="334" fill="#DC2626">否</text>
    <text x="120" y="470" text-anchor="middle" fill="#DC2626">是，循环请求</text>
    <text x="120" y="486" text-anchor="middle" font-size="11" fill="#B45309">（工具调用≤6轮）</text>
    <text x="240" y="340" font-size="11" fill="#64748B">Communicate(curl)</text>
    <text x="240" y="354" font-size="11" fill="#64748B">Skills/Tools 注册表</text>
  </g>

  <text x="20" y="672" font-size="12" fill="#64748B">图3-2 Agent 对话与工具调用流程图（Controller 调度）</text>
</svg>
